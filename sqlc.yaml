version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "database/schemas/admin"
      - "database/schemas/appointments"
      - "database/schemas/core"
      - "database/schemas/functions_triggers"
      - "database/schemas/indexes"
      - "database/schemas/patients"
      - "database/schemas/providers"
      - "database/schemas/sms"
      - "database/schemas/telemedicine"
      - "database/schemas/views"
      - "database/schemas/forum"
    queries:
      - "database/queries/admin"
      - "database/queries/appointments"
      - "database/queries/core"
      - "database/queries/patients"
      - "database/queries/providers"
      - "database/queries/sms"
      - "database/queries/telemedicine"
      - "database/queries/forum"
    gen:
      go:
        package: "sqlc"
        out: "internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: true
        emit_exact_table_names: false
        emit_empty_slices: true
        sql_package: "pgx/v5"
        # Use json.RawMessage for JSONB - this works with all pgx versions
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
