version: "2"
sql:
  - engine: "postgresql"
    schema: "database/schemas/**/*.sql"
    queries: "database/queries/**/*.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: true
        emit_exact_table_names: false
        emit_empty_slices: true
        sql_package: "pgx/v5"
        # Use json.RawMessage for JSONB - this works with all pgx versions
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
