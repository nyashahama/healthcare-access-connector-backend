version: "2"
sql:
  - engine: "postgresql"
    schema: "database/schemas/**/*.sql"
    queries: "database/queries/**/*.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: true
        emit_exact_table_names: false
        emit_empty_slices: true
        sql_package: "pgx/v5"
