name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Setup Go
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.24.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "GOBIN=$HOME/go/bin" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse HEAD)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "short_commit=${SHORT_COMMIT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-w -s \
              -X github.com/nyashahama/healthcare-access-connector-backend/internal/version.Version=${{ steps.meta.outputs.version }} \
              -X github.com/nyashahama/healthcare-access-connector-backend/internal/version.Commit=${{ steps.meta.outputs.commit }} \
              -X github.com/nyashahama/healthcare-access-connector-backend/internal/version.BuildDate=${{ steps.meta.outputs.date }}" \
            -o healthcare-access-connector-${{ steps.meta.outputs.version }}-linux-amd64 \
            ./cmd/api/main.go

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg BUILD_COMMIT=${{ steps.meta.outputs.commit }} \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.date }} \
            -t healthcare-access-connector:${{ steps.meta.outputs.version }} .

      - name: Generate changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:'- %s' $(git describe --tags --abbrev=0 HEAD~1)..HEAD || echo "- Release ${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Record migration version
        run: |
          echo "Migration version at release: $(ls database/migrations/*.up.sql | sort -V | tail -n 1 | sed 's/.*\\//;s/_.*//')" > MIGRATION_VERSION.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.meta.outputs.version }}
          body: |
            ## Release ${{ steps.meta.outputs.version }}

            - **Version:** ${{ steps.meta.outputs.version }}
            - **Commit:** `${{ steps.meta.outputs.commit }}`
            - **Build Date:** ${{ steps.meta.outputs.date }}

            ### Changelog
            ${{ steps.changelog.outputs.changelog }}

            ### Artifacts
            - `healthcare-access-connector-${{ steps.meta.outputs.version }}-linux-amd64`
            - Docker image: `healthcare-access-connector:${{ steps.meta.outputs.version }}`
          files: |
            healthcare-access-connector-${{ steps.meta.outputs.version }}-linux-amd64
            MIGRATION_VERSION.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
