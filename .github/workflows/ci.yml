name: ci
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          REPO="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"
          REF="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" .
      - name: Setup Go
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.25.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "GOBIN=$HOME/go/bin" >> "$GITHUB_ENV"
      - run: go mod download
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Lint changed files
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.25.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          export GOTOOLCHAIN="go${GO_VERSION}"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          BASE_REF="${GITHUB_BASE_REF:-main}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="main"
          fi
          if [ "$BASE_REF" = "main" ] || [ "$BASE_REF" = "develop" ]; then
            git fetch --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            golangci-lint run --timeout 10m --new-from-rev="origin/$BASE_REF" ./...
          else
            golangci-lint run --timeout 10m ./...
          fi
      - name: Security check
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.25.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          export GOTOOLCHAIN="go${GO_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          REPO="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"
          REF="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" .
      - name: Setup Go
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.25.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "GOBIN=$HOME/go/bin" >> "$GITHUB_ENV"
      - run: go mod download
      - name: Run integration tests
        run: go test -tags=integration ./tests/integration

  generated-code-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          REPO="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"
          REF="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" .
      - name: Setup Go
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.25.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "GOBIN=$HOME/go/bin" >> "$GITHUB_ENV"
      - run: go mod download
      - name: Check sqlc drift
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.23.0
          sqlc generate
          git diff --exit-code || (echo "sqlc generated code is out of date. Run 'make sqlc' and commit the changes." && exit 1)
      - name: Check mock drift (optional)
        run: |
          if command -v mockery &> /dev/null; then
            mockery
            git diff --exit-code || (echo "Mocks are out of date. Run 'make mocks' and commit the changes." && exit 1)
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          REPO="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"
          REF="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" .
      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev) \
            --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t healthcare-access-connector:${{ github.sha }} .
      - name: Verify binary has version metadata
        run: |
          docker run --rm healthcare-access-connector:${{ github.sha }} ./api --help || true

  # Environment-backed checks require PostgreSQL
  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_migrations
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout source
        run: |
          REPO="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"
          REF="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" .
      - name: Setup Go
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod | tr -d '\r')"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.25.0"
          fi
          if [[ "$GO_VERSION" != *.*.* ]]; then
            GO_VERSION="${GO_VERSION}.0"
          fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "GOBIN=$HOME/go/bin" >> "$GITHUB_ENV"
      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Validate migrations
        run: ./scripts/ci/migration-check.sh "postgres://postgres:test@localhost:5432/test_migrations?sslmode=disable"
